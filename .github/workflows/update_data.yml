name: Update Aggregated Data

on:
  schedule:
    # Executa diariamente à meia-noite (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite disparo manual na aba Actions do GitHub

permissions:
  contents: write

jobs:
  aggregate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data aggregation pipeline
        env:
          API_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.main --config config/sources.json

      - name: Check for changes and commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/data.json public/llms.txt
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada nos dados agregados."
          else
            git commit -m "chore(data): update aggregated data ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push
          fi
